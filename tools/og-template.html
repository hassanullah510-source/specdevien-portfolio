<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hassan Ullah — social preview</title>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("../site/assets/fonts/space-grotesk-latin.woff2") format("woff2");
      font-weight: 300 700;
      font-display: block;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("../site/assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
      font-weight: 400 700;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 64px 72px 52px;
      background: #07080a;
      color: #f2efe6;
      font-family: "Space Grotesk", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(38% 48% at 82% 12%, rgba(215, 255, 62, 0.2), transparent 70%),
        radial-gradient(42% 50% at 8% 94%, rgba(255, 61, 127, 0.18), transparent 72%),
        radial-gradient(36% 44% at 96% 86%, rgba(91, 124, 255, 0.2), transparent 70%);
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(242, 239, 230, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242, 239, 230, 0.05) 1px, transparent 1px);
      background-size: 120px 120px;
      mask-image: linear-gradient(180deg, #000, transparent 78%);
    }
    .content { position: relative; display: flex; flex-direction: column; height: 100%; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .mark {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 13px;
      background: #d7ff3e;
      color: #07080a;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.08em;
    }
    .brand span:last-child {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a7adbb;
    }
    .tag {
      padding: 9px 16px;
      border: 1px solid rgba(215, 255, 62, 0.35);
      border-radius: 999px;
      color: #d7ff3e;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin-top: auto;
      font-size: 148px;
      font-weight: 600;
      line-height: 0.78;
      letter-spacing: -0.07em;
      text-transform: uppercase;
    }
    h1 .outline {
      display: block;
      color: transparent;
      -webkit-text-stroke: 2px #f2efe6;
      padding-left: 6px;
    }
    .role {
      margin-top: 26px;
      color: #d7ff3e;
      font-size: 27px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .bottom {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(242, 239, 230, 0.16);
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a7adbb;
    }
    .bottom strong { color: #f2efe6; font-weight: 400; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="top">
      <div class="brand">
        <span class="mark">HU</span>
        <span>Portfolio / 2026</span>
      </div>
      <span class="tag">Open to work</span>
    </div>

    <h1>Hassan<span class="outline">Ullah</span></h1>
    <p class="role">Full stack &amp; JavaScript developer</p>

    <div class="bottom">
      <span><strong>hassanullah510@gmail.com</strong></span>
      <span>React · Next.js · Node.js</span>
    </div>
  </div>
</body>
</html>
